name: CI

on:
  push:
  pull_request:

# Both jobs used to run with `working-directory: pharmacy-agent`, a directory
# that does not exist — the repo root IS the pharmacy agent. Every run since at
# least 2026-07-14 failed before a single command executed:
#
#   An error occurred trying to start process '/usr/bin/bash' with working
#   directory '.../rahulai-pharma-new/pharmacy-agent'. No such file or directory
#
# So the red cross meant "the pipeline is misconfigured", never "the code is
# broken", and fifteen commits — including security fixes — went up with no CI
# behind them at all. Paths corrected, and the backend job now runs the real
# suite against real services rather than two files, so a green tick is worth
# something.

jobs:
  admin-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      # Type/template errors that `npm run build` tolerates. It does NOT catch a
      # deleted function still referenced by `onclick={...}` — that reports zero
      # errors and crashes at runtime — which is why the suite below greps for
      # exactly that.
      - run: npx svelte-check --threshold error --output human
      - run: npm run build

  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector, not plain postgres: schema.sql declares a vector column and
        # CREATE EXTENSION vector fails on the stock image.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pharma
          POSTGRES_PASSWORD: pharma
          POSTGRES_DB: pharmacy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pharma"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      POSTGRES_URL: postgresql://pharma:pharma@localhost:5432/pharmacy
      REDIS_URL: redis://localhost:6379/0
      # conftest derives a scratch database per run and refuses to touch the one
      # named here; these are throwaway CI values, not deployment secrets.
      SECRET_KEY: ci-only-not-a-real-secret-32-bytes-long
      OPENROUTER_API_KEY: ci-not-used-no-test-calls-the-model
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: ci-only-password
      # Consumed by psql/pg_dump when they run on the runner rather than inside
      # a container. PGUSER/LIVE_DB match the service above.
      PGHOST: localhost
      PGPORT: "5432"
      PGPASSWORD: pharma
      PGUSER: pharma
      LIVE_DB: pharmacy

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt

      # The suite clones a template database with pg_dump | psql. Locally those
      # run inside the Postgres container; here there is no container, so the
      # client has to exist on the runner. `tests/setup_test_db.sh` picks the
      # path automatically.
      - name: Postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16 || sudo apt-get install -y -qq postgresql-client
          psql --version

      # A fresh database has no schema, and conftest builds its per-run template
      # by fingerprinting the live one. Three stages, in this order — verified
      # against an empty database, because a fresh install is the one path a
      # long-lived deployment never exercises:
      #
      #   1. schema.sql            the catalog/inventory core
      #   2. the app's ensure_*    chat_logs, chat_feedback, users, auth_events,
      #                            turn_metrics, app_events, turn_calls, edges,
      #                            ingest_events — created at BOOT, not by any
      #                            migration and not by schema.sql
      #   3. migrations/*.sql      which ALTER the tables stage 2 creates
      #
      # Skipping stage 2 fails five of the ten migrations with
      # `relation "chat_logs" does not exist` / `"chat_feedback" does not exist`.
      - name: Create the schema
        run: |
          python - <<'PY'
          import asyncio
          from pathlib import Path
          from app.db import apply_schema, run_sql_file

          async def main():
              await apply_schema()
              from app import activity, auth, brand, graph, ingest_events
              from app import admin as admin_mod
              # Order matters: ensure_admin_schema references `users`, so auth
              # runs first. Every DDL ensure_* in app/ is here — miss one and it
              # runs later at app startup instead, which moves the schema AFTER
              # the test template was fingerprinted and fails the isolation
              # guard with a hash mismatch rather than anything legible.
              for fn in (
                  auth.ensure_users_table, auth.ensure_auth_events,
                  admin_mod.ensure_admin_schema, admin_mod.ensure_chat_logs,
                  admin_mod.ensure_feedback, brand.ensure_brand_tables,
                  activity.ensure_turn_metrics, activity.ensure_app_events,
                  activity.ensure_turn_calls, activity.ensure_chat_logs_actor,
                  activity.ensure_chat_feedback_turn,
                  graph.ensure_edges_table, ingest_events.ensure_schema,
              ):
                  await fn()
                  print("boot:", fn.__name__, flush=True)
              for f in sorted(Path("migrations").glob("*.sql")):
                  await run_sql_file(str(f))
                  print("migration:", f.name, flush=True)

          asyncio.run(main())
          PY

      - name: Imports resolve
        run: python -c "import app.api, app.agent, app.tools, app.graph, app.auth, app.admin; print('imports ok')"

      # The whole suite. It needs no OpenRouter call and no real catalog: the
      # data-coupled tests build their own rows. -p no:randomly keeps ordering
      # stable so a failure is reproducible from the log alone.
      - name: Test suite
        run: |
          # 30 tests need the real 5,292-SKU catalog and 111,654 inventory
          # rows. That is customer data: it is not in the repo and must not be.
          # They are named individually rather than skipped by a marker so this
          # list cannot grow silently — if it needs to change, the diff shows
          # exactly which guard stopped running in CI. They still run in the
          # deploy environment against live data; see RUNBOOK.md.
          #
          # Everything else — 1,242 tests, including every source-level guard
          # for accessibility, tokens, scoping logic and dead controls — runs.
          python -m pytest tests/ -q -rf \
            --deselect "tests/test_admin_listings.py::test_catalog_flags_stub_rows" \
            --deselect "tests/test_admin_scope.py::test_stores_summary_scopes_a_pinned_admin" \
            --deselect "tests/test_admin_scope.py::test_stores_summary_unscoped_admin_keeps_every_branch" \
            --deselect "tests/test_analytics.py::test_data_health_inventory_half_is_scoped" \
            --deselect "tests/test_analytics.py::test_data_health_shape" \
            --deselect "tests/test_api.py::test_ready_reports_counts" \
            --deselect "tests/test_cache.py::test_reload_endpoint_bumps_version" \
            --deselect "tests/test_embed_preflight.py::test_a_substring_decoy_branch_is_not_counted_as_visible" \
            --deselect "tests/test_embed_preflight.py::test_prefix_and_suffix_tokens_resolve_to_the_same_single_branch[20005-CCYK]" \
            --deselect "tests/test_embed_preflight.py::test_prefix_and_suffix_tokens_resolve_to_the_same_single_branch[20005]" \
            --deselect "tests/test_embed_preflight.py::test_prefix_and_suffix_tokens_resolve_to_the_same_single_branch[CCYK]" \
            --deselect "tests/test_embed_preflight.py::test_scoped_store_reports_one_branch_and_no_sibling_leak" \
            --deselect "tests/test_embed_preflight.py::test_unregistered_credential_is_reported_false" \
            --deselect "tests/test_embed_preview.py::test_preview_link_mints_a_working_url" \
            --deselect "tests/test_ingest_replace.py::test_the_validated_path_refuses_a_file_that_would_load_nothing[rows1-valid article code]" \
            --deselect "tests/test_security.py::test_find_at_other_stores_does_not_weaken_get_stock" \
            --deselect "tests/test_security.py::test_find_at_other_stores_excludes_scoped_site" \
            --deselect "tests/test_security.py::test_find_at_other_stores_unscoped_no_exclusion" \
            --deselect "tests/test_security.py::test_get_stock_cannot_cross_branch" \
            --deselect "tests/test_security.py::test_get_stock_scoped_to_site" \
            --deselect "tests/test_security.py::test_summarize_article_scoped_total" \
            --deselect "tests/test_sftp_files.py::TestLive::test_one_live_file_per_kind_and_the_rest_are_superseded" \
            --deselect "tests/test_tools.py::test_get_article_info_real" \
            --deselect "tests/test_tools.py::test_get_stock_top_site" \
            --deselect "tests/test_tools.py::test_search_by_name_real" \
            --deselect "tests/test_tools.py::test_summarize_article_real" \
            --deselect "tests/test_tools.py::test_top_by_stock_real_site" \
            --deselect "tests/test_tools_scope.py::test_list_sites_unscoped_search_still_matches_substrings" \
            --deselect "tests/test_tools_scope.py::test_top_by_stock_scope_excludes_a_substring_decoy" \
            --deselect "tests/test_validation.py::TestData::test_a_few_blank_brands_are_tolerated" \
            --deselect "tests/test_validation.py::TestData::test_mostly_blank_brand_names_are_rejected"
