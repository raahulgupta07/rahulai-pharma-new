services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8088:8000"          # host 8088 -> container 8000
    env_file:
      - .env                 # OPENROUTER_API_KEY, SECRET_KEY, tunables
    environment:
      # Override the host-facing URLs from .env: inside the compose network the
      # API reaches the other services by name on their INTERNAL ports.
      POSTGRES_URL: postgresql://pharmacy:pharmacy@postgres:5432/pharmacy
      REDIS_URL: redis://redis:6379/0
      INCOMING_DIR: /incoming
      # Partner public keys the admin API registers land here; the sftp container
      # sees the same volume as /home/pharma/.ssh, and sshd re-reads
      # authorized_keys on every connection — so a new key is live with no restart.
      SFTP_KEYS_DIR: /sftp_ssh
    volumes:
      - sftp_data:/incoming          # shared with sftp + worker (manual /ingest)
      - sftp_ssh:/sftp_ssh           # rw — admin API writes authorized_keys + keys/*.pub
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16    # Postgres 16 + pgvector extension
    environment:
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: pharmacy
      POSTGRES_DB: pharmacy
    ports:
      - "5433:5432"          # host 5433 (5432 already in use) -> container 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacy -d pharmacy"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"          # host 6380 -> container 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # SFTP drop point. Users upload article*/balance* xlsx into /upload.
  # Auth: password (SFTP_PASSWORD) AND/OR SSH key (drop *.pub in ./sftp/keys).
  sftp:
    # Built from docker/sftp (atmoz/sftp, MIT, vendored) rather than pulled:
    # upstream publishes amd64 ONLY, so on an ARM host the container cannot
    # start at all — `exec /entrypoint: exec format error`, forever. Nothing in
    # the image is architecture-specific; it was simply never published for
    # arm64. Building it here means one `up -d --build` works on either.
    build:
      context: ./docker/sftp
    image: citycare-sftp:local
    ports:
      - "2222:22"            # connect: sftp -P 2222 pharma@<host>
    # uid:gid:dir tail makes atmoz create + chown the upload dir to the user,
    # so SFTP writes succeed even though it is a mounted volume.
    command: "pharma:${SFTP_PASSWORD:-pharma}:1001:1001:upload"
    environment:
      # sshd is key-only unless this says true (docker/sftp/files/sshd_config).
      # The password above still creates the account; it just cannot be used to
      # log in. Leave false anywhere the port is reachable from outside.
      SFTP_ALLOW_PASSWORD: "${SFTP_ALLOW_PASSWORD:-false}"
    volumes:
      - sftp_data:/home/pharma/upload
      # THE shared key volume. The api writes /sftp_ssh/authorized_keys (+ mirrors
      # each .pub into /sftp_ssh/keys/); the same volume is this user's ~/.ssh.
      # It replaces the old read-only ./sftp/keys bind — a bind mounted *inside*
      # this volume would shadow the keys the api writes, and the feature would
      # silently do nothing. Drop-a-file-on-the-host key registration is gone;
      # register keys through the admin UI / POST /admin/sftp/keys instead.
      - sftp_ssh:/home/pharma/.ssh
      - ./sftp/chown.sh:/etc/sftp.d/chown.sh:ro   # fix ownership/perms on boot
    restart: unless-stopped

  # Ingest worker: watches the SFTP upload dir, loads new files, busts cache.
  ingest-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "app.watcher"]
    # The worker has no HTTP server, so this is a HEARTBEAT probe instead of a
    # curl: the loop writes /tmp/ingest-worker.heartbeat after every pass it
    # completes, and this fails once that file is stale. It was `disable: true`,
    # which meant the one failure mode that actually happens here — the loop
    # erroring on EVERY pass (drop folder unreadable, Postgres unreachable, bad
    # credentials) — showed as `health=none` forever, because `watch()` catches
    # everything and never exits, so `restart: unless-stopped` never fires
    # either. Files pile up and stock goes stale with nothing going red.
    #
    # The command lives in app/watcher.py so the staleness rule has ONE
    # definition. A `[0-9]`-and-`stat` one-liner here would have to re-derive
    # the threshold from poll_seconds, which is operator-tunable at runtime, and
    # would drift from the loop that writes the file.
    #
    # A paused worker (automatic loading switched off) stays GREEN — that is a
    # deliberate operator setting, and a red light for it would train people to
    # ignore the light. What is measured is the loop, not the ingest.
    healthcheck:
      test: ["CMD", "python", "-m", "app.watcher", "--healthcheck"]
      # The real tolerance is inside the heartbeat (3 missed passes at the
      # interval the loop actually used, plus 5 minutes' slack because a large
      # ingest legitimately blocks the loop for minutes). interval/retries only
      # decide how often we ask and how many probe TIMEOUTS to forgive; 10s is
      # ~15x the module's measured 0.66s import.
      interval: 30s
      timeout: 10s
      retries: 3
      # A fresh container has no heartbeat until its first pass finishes, and
      # the first pass waits on postgres+redis. Do not start counting failures
      # before the loop has had a fair chance to complete one.
      start_period: 120s
    env_file:
      - .env
    environment:
      POSTGRES_URL: postgresql://pharmacy:pharmacy@postgres:5432/pharmacy
      REDIS_URL: redis://redis:6379/0
      INCOMING_DIR: /incoming
    volumes:
      - sftp_data:/incoming          # same volume the SFTP user writes to
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  sftp_data:
  # /home/pharma/.ssh in the sftp container, /sftp_ssh in the api container.
  # Holds authorized_keys + keys/*.pub. atmoz rebuilds authorized_keys from
  # keys/* whenever the container is recreated, which is why the api mirrors
  # each key into keys/ as well as appending it to authorized_keys.
  sftp_ssh:
